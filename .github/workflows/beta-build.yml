# BETA / UNTESTED — maintainer has not verified this artifact.
name: Beta Linux build (untested)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-beta*"

jobs:
  linux-beta:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3 \
            libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 \
            libasound2 libatk-bridge2.0-0 libgtk-3-0
      - name: Build (beta)
        run: |
          chmod +x build_smk_unix.sh scripts/fetch_ffmpeg.sh
          ./build_smk_unix.sh
      - name: Zip
        run: |
          cd dist
          mv smd "SMK-linux-x64-v0.1.1-BETA-UNTESTED"
          zip -r "../SMK-linux-x64-v0.1.1-BETA-UNTESTED.zip" "SMK-linux-x64-v0.1.1-BETA-UNTESTED"
      - uses: actions/upload-artifact@v4
        with:
          name: SMK-linux-x64-BETA-UNTESTED
          path: SMK-linux-x64-v0.1.1-BETA-UNTESTED.zip
